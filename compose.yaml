services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=car_insurance'
      - 'POSTGRES_USER=car_insurance'
      - 'POSTGRES_PASSWORD=secret'
    ports:
      - '5432:5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U car_insurance -d car_insurance']
      interval: 5s
      timeout: 3s
      retries: 10

  # Only started with `docker compose --profile app up`, so Spring Boot's
  # Docker Compose support (./mvnw spring-boot:run) still starts just Postgres.
  app:
    profiles: ['app']
    build: .
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/car_insurance'
      - 'SPRING_DATASOURCE_USERNAME=car_insurance'
      - 'SPRING_DATASOURCE_PASSWORD=secret'
      - 'SPRING_DOCKER_COMPOSE_ENABLED=false'
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:

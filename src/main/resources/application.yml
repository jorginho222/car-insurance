spring:
  application:
    name: car-insurance
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  localities:
    # Imports src/main/resources/data/localidades_cp_maestro.csv on startup when the locality table is empty.
    import-on-startup: true

quotation:
  # Days a quotation stays valid after its issue date (validUntil in the response).
  validity-days: 15
  # When to mark quotations past their valid-until date as EXPIRED (daily at 00:05).
  expiration-cron: "0 5 0 * * *"

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

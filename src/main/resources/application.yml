spring:
  application:
    name: car-insurance
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  localities:
    # Imports src/main/resources/data/localidades_cp_maestro.csv on startup when the locality table is empty.
    import-on-startup: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
